# @package environment.skyrl_gym
# number of background workers for env step calls. Set to 0 to disable background workers.
max_env_workers: 32

text2sql:
  db_path: "/home/ray/default/sql_data"

llm_as_a_judge:
  model: "gpt-4o-mini"
  base_url: null  # or a local endpoint: http://localhost:8000/v1

search:
  log_requests: false
  search_url: "http://127.0.0.1:8000/retrieve"
  topk: 3
  timeout: 30

collabllm_math_500:
  llm_judge:
    enabled: false
    model_name: "mistralai/Mistral-Small-3.1-24B-Instruct-2503"
    base_url: "http://localhost:{port}/v1"
    is_local: true
    local_port: 8002
    temperature: 0.0

collabllm_math_500_multiturn:
  llm_judge:
    enabled: false
    model_name: "mistralai/Mistral-Small-3.1-24B-Instruct-2503"
    base_url: "http://localhost:{port}/v1"
    is_local: true
    local_port: 8002
    temperature: 0.0
  user_simulator:
    enabled: false
    model_name: "mistralai/Mistral-Small-3.1-24B-Instruct-2503"
    base_url: "http://localhost:{port}/v1"
    is_local: true
    local_port: 8002
    temperature: 0.7
    formatting:
      user_template: "User: "
      ai_template: "AI: "
      terminal_signal: "<END_OF_CONVERSATION>"
    tone: "default"

tau2bench_airline:
  domain: "airline"
  task_split: "train"  # train, test, or base
  solo_mode: false  # true = agent works alone, false = interacts with user simulator
  user_llm: "gpt-4.1-mini"  # LLM for user simulator (only used if solo_mode=false)
  user_llm_args:
    temperature: 0.7
  max_turns: 30

tau2bench_retail:
  domain: "retail"
  task_split: "train"
  solo_mode: false
  user_llm: "gpt-4.1-mini"
  user_llm_args:
    temperature: 0.7
  max_turns: 30

tau2bench_telecom:
  domain: "telecom"
  task_split: "train"
  solo_mode: false
  user_llm: "gpt-4.1-mini"
  user_llm_args:
    temperature: 0.7
  max_turns: 30

tau2bench_mock:
  domain: "mock"
  task_split: "train"
  solo_mode: false
  user_llm: "gpt-4.1-mini"
  user_llm_args:
    temperature: 0.7
  max_turns: 30

tau2bench_multidomain: # For multidomain, domain is specified in dataset extras
  task_split: "train"
  solo_mode: false
  user_llm: "gpt-4.1-mini"
  user_llm_args:
    temperature: 0.7
  max_turns: 30